<!DOCTYPE html>

<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanh xuân 11L – Đà Lạt</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --blue:#7fb6e6;
      --blue-dark:#3f6f9e;
      --blue-soft:#eaf3fb;
      --paper:rgba(255,255,255,.92);
      --text:#2b2b2b;
      --shadow:0 20px 40px rgba(0,0,0,.1);
    }

    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      font-family:Inter, sans-serif;
      line-height:1.8;
      color:var(--text);
      background:
        linear-gradient(rgba(234,243,251,.85), rgba(234,243,251,.85)),
        url("nen.png") center/cover repeat fixed;
    }

    /* HERO */
    header{
      min-height:100vh;
      background:
        linear-gradient(rgba(40,70,110,.55),rgba(40,70,110,.55)),
        url('images/hero.jpg') center/cover no-repeat;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
    }

    .hero{
      max-width:900px;
      padding:40px;
      animation:fadeUp 1.2s ease;
    }

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(30px)}
      to{opacity:1;transform:none}
    }

    .hero h1{
      font-family:'Playfair Display', serif;
      font-size:3.5rem;
    }

    .hero h2{margin-top:14px}

    .hero p{
      margin:28px auto 36px;
      max-width:720px;
    }

    .btn{
      display:inline-block;
      padding:14px 38px;
      border-radius:30px;
      background:var(--blue);
      color:#fff;
      text-decoration:none;
      font-weight:600;
      transition:.3s;
      box-shadow:0 8px 20px rgba(0,0,0,.15);
    }

    .btn:hover{
      background:var(--blue-dark);
      transform:translateY(-2px);
    }

    /* SECTION */
    section{padding:90px 10%}

    .paper{
      background:var(--paper);
      border-radius:30px;
      padding:70px;
      box-shadow:var(--shadow);
      margin-bottom:90px;
    }

    h3{
      font-family:'Playfair Display', serif;
      font-size:2.5rem;
      color:var(--blue-dark);
      text-align:center;
      margin-bottom:30px;
    }

    .intro{
      max-width:900px;
      margin:0 auto 45px;
      text-align:center;
    }

    /* CARD */
    .card{
      display:grid;
      grid-template-columns:1fr;
      gap:20px;
      margin-bottom:45px;
      align-items:start;
      padding:24px;
      border-radius:22px;
      background:var(--blue-soft);
      transition:.3s;
    }

    .card:hover{
      transform:translateY(-4px);
      box-shadow:0 14px 30px rgba(0,0,0,.12);
    }

    .card img{
      width:100%;
      height:260px;
      object-fit:cover;
      border-radius:18px;
      transition:.4s;
      cursor:pointer;
    }

    .card img:hover{
